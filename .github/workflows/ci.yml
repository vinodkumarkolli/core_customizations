name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, msi-fedora-docker]
    container:
      image: frappe/erpnext:version-16
      options: --user root
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:6.2-alpine
        ports:
          - 13000:6379

      redis-queue:
        image: redis:6.2-alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: apps/core_customizations

      - name: Setup System Dependencies
        run: |
          apt-get update
          apt-get install -y git python3-dev curl libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb
          
      - name: Setup Node & Cypress
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          npm install -g yarn
          
      - name: Setup Frappe Bench
        run: |
          # Give frappe user ownership of the github workspace
          chown -R frappe:frappe .
          
          # Execute all bench commands as the frappe user to satisfy Frappe compliance
          su frappe -c '
          export PATH=$PATH:~/.local/bin
          pip install frappe-bench
          rm -rf test-bench
          bench init test-bench --skip-redis-config-generation --frappe-branch version-16
          cd test-bench
          
          bench get-app erpnext --branch version-16
          cp -r ../apps/core_customizations apps/core_customizations
          bench setup requirements
          
          bench new-site test.local --db-root-password root --admin-password admin --no-mariadb-socket
          
          bench --site test.local install-app erpnext
          bench --site test.local install-app core_customizations
          '

      - name: Run Backend Integration Tests
        run: |
          su frappe -c '
          export PATH=$PATH:~/.local/bin
          cd test-bench
          bench --site test.local run-tests --app core_customizations
          '

      - name: Run Cypress Frontend Tests
        run: |
          su frappe -c '
          export PATH=$PATH:~/.local/bin
          cd test-bench
          bench --site test.local run-ui-tests core_customizations --headless
          '
