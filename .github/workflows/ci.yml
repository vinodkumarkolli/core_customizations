name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, msi-fedora-docker]
    container:
      image: frappe/erpnext:version-16
      options: --user root
    
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-cache:
        image: redis:6.2-alpine
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3

      redis-queue:
        image: redis:6.2-alpine
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: apps/core_customizations

      - name: Setup System Dependencies
        run: |
          apt-get update
          apt-get install -y git python3-dev curl libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb pkg-config build-essential libmariadb-dev default-libmysqlclient-dev gosu
          
      - name: Setup Node & Cypress
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          npm install -g yarn
          
      - name: Setup Frappe Bench
        run: |
          # Give frappe user ownership of the github workspace
          chown -R frappe:frappe .
          
          # Use gosu (pre-installed in frappe/erpnext images) instead of su.
          # gosu uses Linux setuid/setgid syscalls to properly change the real UID,
          # which su can fail to do in non-interactive Docker environments.
          # bench v5 checks os.getuid() == 0 and exits(1) if still root.
          gosu frappe bash << 'FRAPPE_SETUP'
          set -e
          export PATH=$PATH:~/.local/bin
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          pip install frappe-bench
          rm -rf test-bench
          bench init test-bench --skip-redis-config-generation --no-backups --frappe-branch version-16
          cd test-bench
          
          bench set-config -g db_host mariadb
          # Use the internal container port (6379), NOT the host-mapped port.
          # When the job runs inside a Docker container, GitHub Actions service
          # containers are on the same internal Docker network and are only
          # reachable via the container's internal port, not the host mapping.
          bench set-config -g redis_cache "redis://redis-cache:6379"
          bench set-config -g redis_queue "redis://redis-queue:6379"
          bench set-config -g redis_socketio "redis://redis-queue:6379"
          
          bench get-app erpnext --branch version-16
          bench get-app hrms --branch version-16
          bench get-app india_compliance --branch develop
          cp -r ../apps/core_customizations apps/core_customizations
          bench setup requirements
          
          bench new-site test.local --db-root-password root --admin-password admin --no-mariadb-socket
          
          bench --site test.local install-app erpnext
          bench --site test.local install-app hrms
          bench --site test.local install-app india_compliance
          bench --site test.local install-app core_customizations

          # Run migrate to apply all custom fields, fixtures, and patches
          # from core_customizations to the test site schema before tests run.
          bench --site test.local migrate
          FRAPPE_SETUP



      - name: Run Backend Integration Tests
        run: |
          gosu frappe bash << 'RUN_TESTS'
          set -e
          export PATH=$PATH:~/.local/bin
          cd test-bench
          bench --site test.local run-tests --app core_customizations
          RUN_TESTS

      - name: Run Cypress Frontend Tests
        run: |
          gosu frappe bash << 'RUN_UI_TESTS'
          set -e
          export PATH=$PATH:~/.local/bin
          cd test-bench
          bench --site test.local run-ui-tests core_customizations --headless
          RUN_UI_TESTS
